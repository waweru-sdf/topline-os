# Render blueprint for the Topline API (the backend folder).
# Render reads this when you choose New > Blueprint and pick this GitHub repository.
# The database is on Neon (free and permanent); paste its connection string when Render asks.
services:
  - type: web
    name: topline-api
    runtime: python
    plan: free
    region: frankfurt # closest Render region to Kenya; create the Neon database in Frankfurt too
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Sets up a fresh database (tables + plans) the first time, applies any schema changes,
    # makes the people in ADMIN_PHONES Topline admins, then starts.
    startCommand: >-
      flask --app wsgi init-db &&
      flask --app wsgi db upgrade &&
      flask --app wsgi ensure-admins &&
      gunicorn wsgi:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 2 --threads 4
      --timeout 60 --forwarded-allow-ips "*" --access-logfile -
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET # used by the Hostinger cron job: /api/cron/run?key=...
        generateValue: true
      - key: DATABASE_URL # Neon connection string (postgresql://...)
        sync: false
      - key: ADMIN_PHONES # Topline admins, e.g. Felix:0712000000 (comma-separate several)
        sync: false
      - key: DATABASE_POOL # close connections between requests so Neon can sleep when idle
        value: none
      - key: UPLOAD_STORAGE # Render free wipes its disk on restart: keep photos in the database
        value: database
      - key: ROOT_DOMAIN
        value: toplinehub.co.ke
      - key: FRONTEND_ORIGINS # the website's address(es); add a temporary Hostinger address while testing
        value: https://toplinehub.co.ke,https://www.toplinehub.co.ke
      - key: TIMEZONE
        value: Africa/Nairobi
      - key: EXPOSE_DEV_OTP
        value: "false"
      # Until these are switched on, login codes appear in the Render logs and payments are simulated.
      - key: SMS_MODE
        value: simulation
      - key: PAYMENTS_MODE
        value: simulation
      - key: SIMULATION_APPROVAL
        value: prompt
      - key: PAYMENT_TIMEOUT_MINUTES
        value: "10"
      - key: PLATFORM_COMMISSION_PERCENT
        value: "0"
      - key: GRACE_DAYS
        value: "7"
